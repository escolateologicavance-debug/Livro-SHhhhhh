<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grande Tribulação e Milênio</title>

<style>

body{
margin:0;
font-family:serif;
color:white;
background:black;
}

/* FUNDO */

.fundo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("3-img.png") center/cover no-repeat;
z-index:-3;
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:60px 25px;
background:rgba(0,0,0,0.55);
min-height:100vh;
}

/* TITULO */

h1{
text-align:center;
margin-bottom:40px;
}

/* TEXTO */

#texto{
font-size:22px;
line-height:1.7;
white-space:pre-line;
}

/* BOTÃO */

.botao{
display:block;
margin:60px auto;
padding:14px 34px;
font-size:18px;
background:white;
color:black;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="fundo"></div>

<div class="container">

<h1>Grande Tribulação e Milênio</h1>

<div id="texto"></div>

<button class="botao" onclick="location.href='4.html'">
Prosseguir
</button>

</div>

<script>

const texto = `
1. O Messias não é Promessa para a Igreja, mas para Israel.

2. A Grande Tribulação não é Profecia para a Igreja, mas para Israel.

3. O Anticristo vai se manifestar não contra a Igreja, mas contra Israel.

4. Não haverá mais Salvação após o Arrebatamento, exceto para Israel.
`;

let i = 0;

function digitar(){

if(i < texto.length){

document.getElementById("texto").innerHTML += texto.charAt(i);

i++;

setTimeout(digitar,22);

}

}

digitar();

</script>

</body>
</html>
