<script>

const texto = `

Gilberto Moreira é casado com Sírlei, com quem tem seu maior tesouro na Terra:
Thabita, Rebeca Saron e Reuell.

Tem orgulho e alegria por seu genro Audrey Otávio
e seu futuro genro Jean.

Serve a Jesus desde o ano de 1999.

É fundador da Escola Teológica AVANCE,
desenvolvedor de mais de 20 aplicativos voltados
para o ensino da Palavra de Deus,
gestão emocional e desenvolvimento ministerial.

Escreveu alguns livros eclesiásticos
e dedica-se assiduamente
à difusão da Palavra de Deus.

Paz a Israel.
Paz às almas.

`;

let i = 0;

function digitar(){

if(i < texto.length){

document.getElementById("texto").innerHTML += texto.charAt(i);

i++;

setTimeout(digitar,25);

}else{

setTimeout(()=>{
document.body.style.background="#000";
document.getElementById("final").style.opacity=1;
},2000);

}

}

digitar();

let synth = window.speechSynthesis;
let utterance;

function falar(){

parar();

utterance = new SpeechSynthesisUtterance(texto);

utterance.lang="pt-BR";

synth.speak(utterance);

}

function parar(){

if(synth.speaking){

synth.cancel();

}

}

</script>
